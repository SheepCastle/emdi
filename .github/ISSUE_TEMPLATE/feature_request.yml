name: 기능 및 개선 제안
description: 엠디(emdi)에 추가되었으면 하는 기능이나 사용성 개선 아이디어를 제안합니다.
title: "[Feature] "
labels: ["enhancement", "user-feedback"]
body:
  - type: markdown
    attributes:
      value: |
        엠디(emdi)를 더 좋게 만들기 위한 아이디어를 공유해 주셔서 감사합니다.
  - type: input
    id: version
    attributes:
      label: 앱 버전 (version)
      description: 현재 사용 중인 엠디 버전
      placeholder: "예: 2.7.1"
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: 운영체제 (os)
      description: 주로 사용하는 OS 환경
      placeholder: "예: macOS 15.3 (arm64) 또는 Windows 11 (x86_64)"
    validations:
      required: false
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 현재 어떤 점이 불편하거나 어떤 상황에서 이 기능이 필요하신가요?
      placeholder: "예: 긴 문서를 읽을 때 특정 섹션으로 빠르게 이동하기 어렵습니다."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안 내용
      description: 원하시는 동작 방식, UI 형태, 단축키 등 아이디어를 자유롭게 적어 주세요.
      placeholder: "예: ..."
    validations:
      required: true
