name: Build & Release Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload Windows binary to (e.g. v2.5.1)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build web frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: windows

      - name: Build emdi Windows native binary
        working-directory: windows
        run: cargo build --release

      - name: Package Windows ZIP archive
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION -Raw).Trim()
          $tag = if ("${{ inputs.tag }}" -ne "") { "${{ inputs.tag }}" } elseif ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "v$ver" }
          $zipName = "emdi-$tag-windows-x64.zip"
          New-Item -ItemType Directory -Path dist-win -Force | Out-Null
          Copy-Item "windows/target/release/emdi-windows.exe" "dist-win/emdi.exe"
          Copy-Item "CHANGELOG.md" "dist-win/CHANGELOG.md"
          Compress-Archive -Path "dist-win/*" -DestinationPath $zipName -Force
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append
          Get-Item $zipName

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: emdi-windows-x64
          path: ${{ env.ZIP_NAME }}

      - name: Attach Windows ZIP to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release view "$env:TAG" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:TAG" "$env:ZIP_NAME" --clobber
          } else {
            gh release create "$env:TAG" "$env:ZIP_NAME" --title "엠디 (emdi) $env:TAG" --generate-notes
          }
